name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    with:
      MODE: 'production'
      PORT: 3000
      REMOTE_HOST: ${{ vars.SSH_HOST_PROD }}
      REMOTE_USER_NAME: ${{ vars.SSH_USER_NAME_PROD || 'root' }}
      NAME: 'netease-music-prod'
      INSTANCES: 2
    secrets: inherit