# Nginx HTTPS配置 - 网易云音乐项目
# 支持HTTPS安全连接
# 文件位置: /etc/nginx/sites-available/netease-music

# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name lucky-music.top www.lucky-music.top;
    
    # 重定向所有HTTP请求到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name lucky-music.top www.lucky-music.top;
    
    # SSL证书配置 (使用Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/lucky-music.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucky-music.top/privkey.pem;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:DHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 日志配置
    access_log /var/log/nginx/netease-music.access.log;
    error_log /var/log/nginx/netease-music.error.log;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 反向代理到Express应用
    # Express已经托管了前端静态文件和API
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 安全配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'; connect-src 'self' https: wss:" always;
}

# 配置说明:
# 1. 安装Certbot: sudo apt install certbot python3-certbot-nginx
# 2. 申请SSL证书: sudo certbot --nginx -d lucky-music.top -d www.lucky-music.top
# 3. 复制此配置到: /etc/nginx/sites-available/netease-music
# 4. 创建软链接: sudo ln -s /etc/nginx/sites-available/netease-music /etc/nginx/sites-enabled/
# 5. 测试配置: sudo nginx -t
# 6. 重载Nginx: sudo systemctl reload nginx
# 7. 证书自动续期: sudo crontab -e 添加 "0 12 * * * /usr/bin/certbot renew --quiet"